<style>
/* Layout: one-screen kiosk for a landscape tablet — logo + section tabs, full-bleed wheel of plates, centred dish card, category control pinned to the bottom. Deliberately light only: every photo sits on pure white. */
:root {
  --bg: #FFFFFF;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --faint: #A8A8AD;
  --well: #F3F2F4;
  --accent: #8D1D30;
  --accent-ink: #FFFFFF;
  --font-display: "Inter Tight", -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-text: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.25, .8, .25, 1);
  color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
}

.gutter {
  padding-left: max(16px, 3.2vw, env(safe-area-inset-left, 0px));
  padding-right: max(16px, 3.2vw, env(safe-area-inset-right, 0px));
}

/* Logo row + section tabs */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 24px;
  padding-block: clamp(8px, 1.6vh, 26px) 0;
}
.logo { height: clamp(24px, 3.8vh, 48px); width: auto; display: block; }
.tabs { display: flex; gap: clamp(18px, 2.6vw, 44px); }
.tab {
  position: relative;
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  min-height: 44px;
  color: var(--faint);
  font: 600 clamp(16px, min(1.6vw, 2.7vh), 30px)/1 var(--font-display);
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: color .3s var(--ease);
}
.tab::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 4px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform .35s var(--ease);
}
.tab[aria-pressed="true"] { color: var(--ink); }
.tab[aria-pressed="true"]::after { transform: scaleX(1); }
.tab:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 4px; border-radius: 4px; }

/* Wheel */
.stage {
  position: relative;
  overflow: hidden;
  overflow: clip visible; /* the centre photo may grow past the wheel's band into the white margins above and below */
  touch-action: none;
  cursor: grab;
  min-width: 0;
  transition: opacity .16s var(--ease);
}
.stage.is-swapping { opacity: 0; }
.stage.is-dragging { cursor: grabbing; }
.plate {
  position: absolute;
  left: 50%;
  top: 50%;
  will-change: transform, opacity;
  transform-origin: 50% 50%;
}
.plate img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

/* Dish card: fixed height so the wheel never jumps between short and long cards */
.info {
  text-align: center;
  height: clamp(230px, 34vh, 440px);
  padding-block: clamp(4px, 1vh, 14px) clamp(6px, 1.4vh, 18px);
  display: grid;
  grid-template-rows: minmax(0, 1fr);
}
.about {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: clamp(5px, 0.95vh, 12px);
  min-height: 0;
}
.info.rise .about > *, .info.rise .buy { animation: rise .32s var(--ease) both; }
.info.rise .about > *:nth-child(2) { animation-delay: .03s; }
.info.rise .about > *:nth-child(3) { animation-delay: .05s; }
.info.rise .about > *:nth-child(4) { animation-delay: .07s; }
.info.rise .about > *:nth-child(5) { animation-delay: .08s; }
.info.rise .buy { animation-delay: .1s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.eyebrow {
  margin: 0;
  font-size: clamp(12px, min(1.05vw, 1.8vh), 19px);
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, min(3.4vw, 4.6vh), 66px);
  line-height: 1.05;
  letter-spacing: -0.028em;
  text-wrap: balance;
  max-width: 30ch;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.kz {
  margin: 0;
  font-size: clamp(14px, min(1.25vw, 2vh), 23px);
  line-height: 1.3;
  color: var(--muted);
  max-width: 40ch;
}
.desc {
  margin: 0;
  font-size: clamp(14px, min(1.25vw, 2vh), 23px);
  line-height: 1.4;
  color: var(--ink);
  opacity: .82;
  max-width: 54ch;
  text-wrap: balance;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Price: its own row right under the description, always dead centre; the badge sits beside it without pushing it */
.buy {
  justify-self: stretch;
  margin-top: clamp(2px, 0.6vh, 10px);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: clamp(10px, 1.1vw, 20px);
  font-variant-numeric: tabular-nums;
}
.tag-slot { justify-self: start; display: flex; }
.price {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(20px, min(2.2vw, 3.6vh), 44px);
  letter-spacing: -0.015em;
}
.meta {
  margin: 0;
  font-size: clamp(13px, min(1.1vw, 1.9vh), 20px);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tag {
  align-self: center;
  padding: .28em .8em .32em;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  color: var(--accent);
  font-size: clamp(12px, min(0.95vw, 1.7vh), 17px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.02em;
}

/* Category control */
.bar {
  display: grid;
  justify-items: center;
  gap: clamp(6px, 1vh, 12px);
  padding-block: 0 clamp(12px, 2.4vh, 32px);
  min-width: 0;
}
.hint {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.6em;
  font-size: clamp(12px, 0.95vw, 17px);
  color: var(--faint);
  transition: opacity .5s var(--ease);
}
.hint.is-gone { opacity: 0; }
.hint svg { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.seg-scroll {
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.seg-scroll.is-overflowing {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
}
.seg-scroll::-webkit-scrollbar { display: none; }
.seg {
  position: relative;
  display: flex;
  gap: 2px;
  padding: 5px;
  background: var(--well);
  border-radius: 999px;
  width: max-content;
}
.seg-ind {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: 0;
  width: 0;
  border-radius: 999px;
  background: var(--accent);
  transition: transform .42s var(--ease), width .42s var(--ease);
}
.seg button {
  position: relative;
  z-index: 1;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: 500 max(13px, calc(clamp(14px, min(1.15vw, 2vh), 22px) * var(--fit, 1)))/1 var(--font-text);
  letter-spacing: -0.005em;
  min-height: clamp(44px, 6.2vh, 70px);
  padding: 0 calc(clamp(14px, 1.6vw, 34px) * var(--fit, 1));
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .3s var(--ease);
}
.seg button[aria-pressed="true"] { color: var(--accent-ink); }
.seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

@media (max-width: 600px) {
  .desc { -webkit-line-clamp: 3; }
  .top { justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  .info.rise > * { animation: none; }
  .seg-ind, .hint, .stage, .tab, .tab::after { transition: none; }
}

/* Kiosk: no zoom, no pull-to-refresh, no long-press menus */
html, body { overscroll-behavior: none; touch-action: manipulation; }
</style>
</head>

    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    stage.classList.remove('is-dragging');
    if (!moved) {
      const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains('plate'));
      if (hit) {
        const i = +hit.dataset.i;
        if (i !== mod(Math.round(target), N)) { goTo(i); wake(); }
      }
      kick();
      return;
    }
    const a = samples[0], b = samples[samples.length - 1];
    const dt = (b.t - a.t) / 1000;
    const v = dt > 0.005 ? (b.p - a.p) / dt : 0;
    vel = Math.max(-14, Math.min(14, v));
    const proj = pos + vel * 0.22;
    target = Math.round(Math.max(pos - 6, Math.min(pos + 6, proj)));
    kick();
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('contextmenu', e => e.preventDefault());

  // Mouse wheel / trackpad
  let wAcc = 0, wLast = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    wAcc += d;
    const now = performance.now();
    if (Math.abs(wAcc) > 40 && now - wLast > 220) {
      target = Math.round(target) + Math.sign(wAcc);
      wAcc = 0;
      wLast = now;
      wake();
      kick();
    }
  }, { passive: false });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { target = Math.round(target) + 1; wake(); kick(); }
    if (e.key === 'ArrowLeft') { target = Math.round(target) - 1; wake(); kick(); }
  });

  // Swipe hint: hides once someone swipes, comes back after 25 s of quiet
  let idleTimer = 0;
  function wake() {
    hint.classList.add('is-gone');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => hint.classList.remove('is-gone'), 25000);
  }

  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(stage);
  window.addEventListener('resize', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); placeIndicator(); });


  // ===== Kiosk: auto-update, offline photos, screen awake =====
  // Guests who scan the table QR code open the menu with ?qr: their phones load photos only as they swipe
  const GUEST = /[?&]qr\b/.test(location.search);
  const imgURL = key => 'img/' + key + '.webp?v=' + IMG_V;
  window.addEventListener('contextmenu', e => e.preventDefault());

  // Last touch time, so an update never reloads the page under a guest's finger
  let lastTouch = Date.now();
  ['pointerdown', 'keydown', 'wheel'].forEach(t =>
    window.addEventListener(t, () => { lastTouch = Date.now(); }, { capture: true, passive: true }));
  const QUIET_MS = 2 * 60 * 1000;

  // New version published → reload once nobody has touched the screen for two minutes
  let newVersion = false;
  async function checkUpdate() {
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = (await r.json()).version;
      if (v && v !== VERSION) newVersion = true;
    } catch (e) { /* offline: keep showing the saved menu */ }
  }
  setInterval(checkUpdate, 5 * 60 * 1000);
  setInterval(() => { if (newVersion && Date.now() - lastTouch > QUIET_MS) location.reload(); }, 20 * 1000);

  // Offline: keep every photo on the tablet
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const allKeys = MENU.flatMap(s => s.subs.flatMap(sub => sub.items.map(it => it.img)));
  let preIdx = 0;
  function preloadNext() {
    if (preIdx >= allKeys.length) return;
    const im = new Image();
    im.onload = im.onerror = () => setTimeout(preloadNext, 30);
    im.src = imgURL(allKeys[preIdx++]);
  }
  if (!GUEST) setTimeout(() => { for (let k = 0; k < 3; k++) preloadNext(); }, 2500);

  // Keep the screen on while the menu is open
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) { /* not allowed here: the kiosk app keeps the screen on */ }
  }
  if (!GUEST) {
    document.addEventListener('visibilitychange', keepAwake);
    keepAwake();
  }

  buildSection(0);
  info.classList.remove('rise');
})();
</script>
</body>
</html>
